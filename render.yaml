# Render Blueprint for the TEJ Capital subsystem.
#
# The existing `trading_journal-1` API service is intentionally NOT declared
# here — it was created outside Blueprint and should stay that way. This
# Blueprint only manages the new tej-capital stack (API + Postgres).
#
# To provision: Render Dashboard → Blueprints → New Blueprint Instance →
# pick the tejpal-abundent/trading_journal repo → main branch.

services:
  - type: web
    name: tej-capital-api
    runtime: docker
    dockerfilePath: ./tej-capital/backend/Dockerfile
    dockerContext: ./tej-capital/backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: TEJ_DATABASE_URL
        fromDatabase:
          name: tej-capital-db
          property: connectionString
      - key: TEJ_ENV
        value: prod
      - key: TEJ_CORS_ORIGINS
        value: https://tradingjournal.tejpalkumawat1182.workers.dev,https://tradingjournal.pages.dev
      # Integration credentials — set in Render dashboard, not in git.
      - key: TEJ_TELEGRAM_BOT_TOKEN
        sync: false
      - key: TEJ_TELEGRAM_CHAT_ID
        sync: false
      - key: TEJ_QDRANT_URL
        sync: false
      - key: TEJ_LLM_API_KEY
        sync: false
      - key: TEJ_MT5_LOGIN
        sync: false
      - key: TEJ_BYBIT_API_KEY
        sync: false
      - key: TEJ_DARWINEX_API_KEY
        sync: false
      - key: TEJ_ALLOCATOR_LINK_SECRET
        generateValue: true

databases:
  - name: tej-capital-db
    plan: free
    databaseName: tej_capital
    user: tej
    postgresMajorVersion: 16
    region: oregon
