# Render Blueprint for the TEJ Capital subsystem.
#
# Runs only the FastAPI web service on Render.
# The database is Neon (Postgres, AWS Frankfurt eu-central-1, free tier)
# — no Render-managed Postgres is declared here, so TEJ_DATABASE_URL is
# set manually in the Render dashboard as a plain env var pointing at the
# Neon connection string.
#
# The existing `trading_journal-1` API service is intentionally NOT declared
# here — it was created outside Blueprint and should stay that way.
#
# To provision: Render Dashboard → Blueprints → New Blueprint Instance →
# pick the tejpal-abundent/trading_journal repo → main branch.

services:
  - type: web
    name: tej-capital-api
    runtime: docker
    dockerfilePath: ./tej-capital/backend/Dockerfile
    dockerContext: ./tej-capital/backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      # Points at Neon (AWS Frankfurt). Value set manually in Render dashboard
      # — sync:false keeps it out of git. asyncpg is fine with sslmode/
      # channel_binding params; config.py normalises them at startup.
      - key: TEJ_DATABASE_URL
        sync: false
      - key: TEJ_ENV
        value: prod
      - key: TEJ_CORS_ORIGINS
        value: https://tradingjournal.tejpalkumawat1182.workers.dev,https://tradingjournal.pages.dev
      # Integration credentials — set in Render dashboard, not in git.
      - key: TEJ_TELEGRAM_BOT_TOKEN
        sync: false
      - key: TEJ_TELEGRAM_CHAT_ID
        sync: false
      - key: TEJ_QDRANT_URL
        sync: false
      - key: TEJ_LLM_API_KEY
        sync: false
      - key: TEJ_MT5_LOGIN
        sync: false
      - key: TEJ_BYBIT_API_KEY
        sync: false
      - key: TEJ_DARWINEX_API_KEY
        sync: false
      - key: TEJ_ALLOCATOR_LINK_SECRET
        generateValue: true
