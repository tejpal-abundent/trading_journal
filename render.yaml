services:
  # ─── Existing trading-journal API (unchanged) ─────────────
  - type: web
    name: trading-journal-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: TURSO_DB_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

  # ─── NEW: TEJ Capital API (FastAPI + Postgres) ────────────
  - type: web
    name: tej-capital-api
    runtime: docker
    dockerfilePath: ./tej-capital/backend/Dockerfile
    dockerContext: ./tej-capital/backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TEJ_DATABASE_URL
        fromDatabase:
          name: tej-capital-db
          property: connectionString
      - key: TEJ_ENV
        value: prod
      - key: TEJ_CORS_ORIGINS
        value: https://tradingjournal.tejpalkumawat1182.workers.dev,https://tradingjournal.pages.dev
      # Integration credentials — set in Render dashboard, not in git.
      - key: TEJ_TELEGRAM_BOT_TOKEN
        sync: false
      - key: TEJ_TELEGRAM_CHAT_ID
        sync: false
      - key: TEJ_QDRANT_URL
        sync: false
      - key: TEJ_LLM_API_KEY
        sync: false
      - key: TEJ_MT5_LOGIN
        sync: false
      - key: TEJ_BYBIT_API_KEY
        sync: false
      - key: TEJ_DARWINEX_API_KEY
        sync: false
      - key: TEJ_ALLOCATOR_LINK_SECRET
        generateValue: true

databases:
  - name: tej-capital-db
    plan: free
    databaseName: tej_capital
    user: tej
    postgresMajorVersion: 16
